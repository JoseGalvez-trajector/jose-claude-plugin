name: Release

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  discover-plugins:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-plugins: ${{ steps.set-matrix.outputs.has-plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build matrix of changed plugins
        id: set-matrix
        run: |
          CHANGED_PLUGINS=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^plugins/' \
            | sed 's|^plugins/\([^/]*\)/.*|\1|' \
            | sort -u \
            | jq -R . | jq -sc .)
          echo "matrix={\"plugin\":$CHANGED_PLUGINS}" >> $GITHUB_OUTPUT
          if [[ "$CHANGED_PLUGINS" == "[]" ]]; then
            echo "has-plugins=false" >> $GITHUB_OUTPUT
          else
            echo "has-plugins=true" >> $GITHUB_OUTPUT
          fi

  release:
    needs: discover-plugins
    if: needs.discover-plugins.outputs.has-plugins == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.discover-plugins.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: >
          npm install --no-save
          semantic-release
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          @semantic-release/github
          conventional-changelog-conventionalcommits

      - name: Generate .releaserc.json for plugin
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          jq -n \
            --arg plugin "$PLUGIN" \
            '{
              branches: ["main"],
              tagFormat: ($plugin + "@${version}"),
              plugins: [
                ["@semantic-release/commit-analyzer", {
                  preset: "conventionalcommits",
                  releaseRules: [
                    { type: "feat", release: "minor" },
                    { type: "fix", release: "patch" },
                    { type: "perf", release: "patch" },
                    { type: "docs", release: "patch" },
                    { type: "refactor", release: "patch" }
                  ]
                }],
                ["@semantic-release/release-notes-generator", { preset: "conventionalcommits" }],
                ["@semantic-release/github", { successComment: false, failComment: false }]
              ]
            }' > .releaserc.json

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          npx --no semantic-release
          NEW_VERSION=$(git describe --tags --match "$PLUGIN@*" --abbrev=0 2>/dev/null | sed "s|^$PLUGIN@||")
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Update and commit marketplace.json
        if: steps.semantic.outputs.new_version != ''
        env:
          PLUGIN: ${{ matrix.plugin }}
          NEW_VERSION: ${{ steps.semantic.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin main
            jq --arg name "$PLUGIN" --arg v "$NEW_VERSION" \
              '(.plugins[] | select(.name == $name) | .version) = $v' \
              .claude-plugin/marketplace.json > tmp.json && mv tmp.json .claude-plugin/marketplace.json
            git diff --quiet .claude-plugin/marketplace.json && exit 0
            git add .claude-plugin/marketplace.json
            git commit -m "chore(marketplace): bump $PLUGIN to $NEW_VERSION [skip ci]" && \
            git push && exit 0
            git reset HEAD~1
            sleep $((i * 2))
          done
          exit 1

      - name: Upload semantic-release lifecycle data on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: "semantic-release-${{ matrix.plugin }}-lifecycles"
          path: ".semantic-release.*.json"
          if-no-files-found: warn
          retention-days: 5
